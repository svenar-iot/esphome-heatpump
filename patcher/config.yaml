tasks:
  - prepare
  - patch
  - move
  - cleanup

prepare:
  - "[rmdir] workdir"
  - "[mkdir] workdir"
  - "[clone] https://github.com/Mosibi/Midea-heat-pump-ESPHome.git workdir"

patch:
  - "[patch] workdir/models/R32-generic.yaml patches/R32-generic.patch"
  - "[patch] workdir/models/R32-airwell.yaml patches/R32-airwell.patch"
  - "[patch] workdir/models/R290-generic.yaml patches/R290-generic.patch"
  - "[patch] workdir/models/R290-ferroli.yaml patches/R290-ferroli.patch"

move:
  - "[rename] workdir/models/R32-generic.yaml ../models/midea-R32-generic.yaml"
  - "[rename] workdir/models/R32-airwell.yaml ../models/midea-R32-airwell.yaml"
  - "[rename] workdir/models/R290-generic.yaml ../models/midea-R290-generic.yaml"
  - "[rename] workdir/models/R290-ferroli.yaml ../models/midea-R290-ferroli.yaml"

cleanup:
  - "[rmdir] workdir"